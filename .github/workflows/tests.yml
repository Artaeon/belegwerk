# Die Suite läuft bei jedem Push und Pull Request — dieselben 64 Tests
# wie lokal, inklusive PDF-Erzeugung (Chromium bringt Puppeteer mit;
# --no-sandbox setzt der Code nur, wenn CI gesetzt ist).
name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # Bun führt Postinstall-Skripte nicht ungefragt aus — Puppeteers
      # Chrome-Download läuft deshalb hier ausdrücklich. Ohne Browser
      # schlagen alle PDF-Tests fehl; genau so sah der erste CI-Lauf aus.
      - run: bunx puppeteer browsers install chrome
      - run: bun test
